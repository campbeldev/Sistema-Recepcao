<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campbel - Todos os Contatos</title>
    <link rel="stylesheet" th:href="@{/css/agenda.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="header">
    <div class="header-content">
        <img th:src="@{/images/logo-campbel.png}" alt="Campbel" class="logo-small">
        <h1>Todos os Contatos</h1>
        <a th:href="@{/}" class="back-link">← Voltar</a>
    </div>
</header>

<main class="container">
    <div class="search-box">
        <input type="text" id="buscaContato" placeholder="🔍 Buscar por nome, empresa ou email..." class="search-input">
    </div>

    <div class="stats">
        <span>Total: <strong id="totalContatos">0</strong> contatos</span>
    </div>

    <div class="agenda-lista" id="agendaLista">
        <div class="loading">Carregando...</div>
    </div>
</main>

<script th:src="@{/js/lista_contatos.js}"></script>
</body>
</html>
