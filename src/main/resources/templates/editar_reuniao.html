<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campbel - Editar Reunião</title>
    <link rel="stylesheet" th:href="@{/css/reunioes.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="header">
    <div class="header-content">
        <img th:src="@{/images/logo-campbel.png}" alt="Campbel" class="logo-small">
        <h1>Editar Reunião</h1>
        <a th:href="@{'/reuniao/detalhes_reuniao?id=' + ${reuniaoId}}" class="back-link">← Voltar para Detalhes</a>
    </div>
</header>

<main class="container">
    <div class="card">
        <h2>Editar Reunião</h2>
        <form id="formEditarReuniao">
            <input type="hidden" id="reuniaoId" th:value="${reuniaoId}">

            <!-- TÍTULO -->
            <div class="form-group">
                <label for="titulo">Título da Reunião *</label>
                <input type="text" id="titulo" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="empresaReuniao">Empresa</label>
                <input type="text" id="empresaReuniao" class="form-control" placeholder="Nome da empresa para esta reunião">
            </div>

            <!-- ===== NOVA SEÇÃO: MÚLTIPLOS ANFITRIÕES ===== -->
            <div class="form-group">
                <label>Anfitriões *</label>
                <div class="anfitrioes-container">
                    <!-- Lista de anfitriões selecionados -->
                    <div id="listaAnfitrioesSelecionados" class="anfitrioes-selecionados">
                        <div class="anfitrioes-placeholder">Nenhum anfitrião adicionado</div>
                    </div>

                    <!-- Campo para adicionar novo anfitrião -->
                    <div class="campo-com-lista">
                        <input type="text"
                               id="novoAnfitriaoInput"
                               class="form-control campo-busca"
                               placeholder="Digite para buscar e adicionar anfitrião..."
                               autocomplete="off">
                        <div class="lista-flutuante" id="listaNovoAnfitriao"></div>
                    </div>
                </div>
            </div>
            <!-- ===== FIM DA NOVA SEÇÃO ===== -->

            <!-- DATA E HORA -->
            <div class="form-group">
                <label for="horario">Data e Hora *</label>
                <input type="datetime-local" id="horario" class="form-control" required>
            </div>

            <!-- SALA -->
            <div class="form-group">
                <label for="sala">Sala *</label>
                <select id="sala" class="form-control" required>
                    <option value="Sala 01">Sala 01</option>
                    <option value="Sala 02">Sala 02</option>
                    <option value="Sala 03">Sala 03</option>
                    <option value="Sala de Reuniões">Sala de Reuniões</option>
                    <option value="Auditório">Auditório</option>
                </select>
            </div>

            <!-- MOTIVO -->
            <div class="form-group">
                <label for="motivo">Motivo / Pauta</label>
                <textarea id="motivo" class="form-control" rows="3"></textarea>
            </div>

            <!-- STATUS -->
            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" class="form-control">
                    <option value="AGENDADA">⏳ Agendada</option>
                    <option value="FINALIZADA">✅ Finalizada</option>
                    <option value="CANCELADA">❌ Cancelada</option>
                </select>
            </div>

            <!-- PARTICIPANTES ATUAIS -->
            <div class="form-group">
                <label>Participantes Atuais</label>
                <div id="participantesAtuais" class="participantes-lista">
                    <!-- Será preenchido via JavaScript -->
                </div>
            </div>

            <!-- ADICIONAR NOVOS PARTICIPANTES -->
            <div class="form-group">
                <label>Adicionar Novo Participante</label>
                <div class="campo-com-lista">
                    <input type="text"
                           id="novoParticipanteInput"
                           class="form-control campo-busca"
                           placeholder="Digite para buscar e adicionar..."
                           autocomplete="off">
                    <div class="lista-flutuante" id="listaNovoParticipante"></div>
                </div>
            </div>

            <!-- BOTÕES -->
            <div class="botoes-form">
                <button type="button" class="btn-cancelar" onclick="window.location.href='/reuniao/detalhes_reuniao?id=' + document.getElementById('reuniaoId').value">Cancelar</button>
                <button type="submit" class="btn-salvar">💾 Salvar Alterações</button>
            </div>
        </form>
    </div>
</main>

<script th:src="@{/js/editar_reuniao.js}"></script>
</body>
</html>
