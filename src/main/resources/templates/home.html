<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campbel - Sistema de Recepção</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
    <link rel="stylesheet" th:href="@{/css/modal.css}">
    <link rel="stylesheet" th:href="@{/css/usuarios.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="header">
    <div class="container">
        <div class="header-content">
            <div class="logo-area">
                <img th:src="@{/images/logo-campbel.png}" alt="Campbel" class="logo">
                <h1>Sistema de Recepção</h1>
            </div>

            <!-- ÁREA DO USUÁRIO E BOTÕES -->
            <div class="header-right">
                <!-- INFO DO USUÁRIO LOGADO -->
                <div class="user-info" th:if="${session.usuarioLogado != null}">
                    <span class="user-name">
                        👤 <span th:text="${session.usuarioLogado.nome}">Usuário</span>
                        <span th:if="${session.usuarioLogado.role == 'ADMIN'}" class="admin-badge">Admin</span>
                    </span>
                </div>

                <!-- BOTÕES DE AÇÃO -->
                <div class="header-actions">
                    <a th:href="@{/paginas/contato}" class="header-btn">
                        <span>👤</span> Novo Contato
                    </a>
                    <a th:href="@{/paginas/reuniao}" class="header-btn">
                        <span>📅</span> Nova Reunião
                    </a>
                    <a th:href="@{/agenda}" class="header-btn">
                        <span>📇</span> Agenda
                    </a>

                    <!-- BOTÕES DE ADMIN (só aparecem para ADMIN) -->
                    <div th:if="${session.usuarioLogado != null && session.usuarioLogado.role == 'ADMIN'}" class="admin-actions">
                        <a th:href="@{/usuarios}" class="header-btn admin-btn" title="Gerenciar Usuários">
                            <span>👥</span> Usuários
                        </a>
                    </div>

                    <!-- BOTÃO DE LOGOUT (aparece para todos) -->
                    <a href="/logout" class="header-btn logout-btn" onclick="sessionStorage.removeItem('modalReunioesMostradoNestaSessao');">
                        <span>🚪</span> Sair
                    </a>
                </div>
            </div>
        </div>
    </div>
</header>

<main class="container">
    <!-- DASHBOARD -->
    <div class="dashboard">
        <a href="/reunioes/finalizadas" class="dashboard-item">
            <span class="dashboard-icone">✅</span>
            <span class="dashboard-info">
                <span class="dashboard-valor" id="reunioesRealizadas">0</span>
                <span class="dashboard-label">REALIZADAS</span>
            </span>
        </a>
        <a href="/reunioes/canceladas" class="dashboard-item">
            <span class="dashboard-icone">❌</span>
            <span class="dashboard-info">
                <span class="dashboard-valor" id="reunioesCanceladas">0</span>
                <span class="dashboard-label">CANCELADAS</span>
            </span>
        </a>
        <a href="/reunioes/hoje" class="dashboard-item">
            <span class="dashboard-icone">📅</span>
            <span class="dashboard-info">
                <span class="dashboard-valor" id="reunioesHoje">0</span>
                <span class="dashboard-label">HOJE</span>
            </span>
        </a>
        <a href="/reunioes/semana" class="dashboard-item">
            <span class="dashboard-icone">📆</span>
            <span class="dashboard-info">
                <span class="dashboard-valor" id="reunioesSemana">0</span>
                <span class="dashboard-label">SEMANA</span>
            </span>
        </a>
        <a href="/agenda" class="dashboard-item">
            <span class="dashboard-icone">👥</span>
            <span class="dashboard-info">
                <span class="dashboard-valor" id="totalContatos">0</span>
                <span class="dashboard-label">CONTATOS</span>
            </span>
        </a>
    </div>

    <!-- BOTÃO DE RELATÓRIO -->
    <div style="display: flex; justify-content: flex-end; margin-bottom: 2rem;">
        <button onclick="abrirModalRelatorio()" class="btn-relatorio" style="border: none; cursor: pointer;">
            📊 Relatório Mensal
        </button>
    </div>

    <!-- PRÓXIMAS REUNIÕES -->
    <section class="reunioes-section">
        <div class="section-header">
            <h2>Próximas Reuniões</h2>
            <a th:href="@{/paginas/reuniao}" class="btn-small">+ Agendar</a>
        </div>
        <div class="reunioes-list" id="reunioesList"></div>
    </section>

    <!-- ÚLTIMOS CONTATOS -->
    <section class="contatos-section">
        <div class="section-header">
            <h2>Últimos Contatos</h2>
            <a th:href="@{/paginas/contato}" class="btn-small">+ Novo</a>
        </div>
        <div class="contatos-list" id="contatosList"></div>
    </section>
</main>

<!-- MODAL DE RELATÓRIO (DIRETO NO HTML) -->
<div id="modalRelatorio" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📊 Gerar Relatório Mensal</h3>
            <span class="modal-close" onclick="fecharModalRelatorio()">&times;</span>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="mesRelatorio">Mês:</label>
                <select id="mesRelatorio" class="form-control">
                    <option value="1">Janeiro</option>
                    <option value="2">Fevereiro</option>
                    <option value="3">Março</option>
                    <option value="4">Abril</option>
                    <option value="5">Maio</option>
                    <option value="6">Junho</option>
                    <option value="7">Julho</option>
                    <option value="8">Agosto</option>
                    <option value="9">Setembro</option>
                    <option value="10">Outubro</option>
                    <option value="11">Novembro</option>
                    <option value="12">Dezembro</option>
                </select>
            </div>
            <div class="form-group">
                <label for="anoRelatorio">Ano:</label>
                <select id="anoRelatorio" class="form-control">
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026" selected>2026</option>
                    <option value="2027">2027</option>
                </select>
            </div>
            <div class="form-group">
                <label>Tipo de arquivo:</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="tipoRelatorio" value="csv" checked> CSV (Excel)
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="tipoRelatorio" value="txt"> TXT
                    </label>
                </div>
            </div>
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="incluirCanceladas" checked>
                    Incluir reuniões canceladas
                </label>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="fecharModalRelatorio()">Cancelar</button>
            <button class="btn-primary" onclick="gerarRelatorio()">📥 Baixar Relatório</button>
        </div>
    </div>
</div>


<script>
    window.loginRecente = /*[[${loginRecente}]]*/ false;
</script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/notificacao.js}"></script>
</body>
</html>
