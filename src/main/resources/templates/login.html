<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campbel - Login</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="card">
        <div class="logo-wrapper">
            <img th:src="@{/images/logo-campbel.png}" alt="Campbel" class="logo">
        </div>

        <h2>Bem-vindo ao Sistema</h2>

        <div th:if="${param.cadastro != null}" class="alert-success">
            ✅ Cadastro realizado! Faça seu login.
        </div>

        <div th:if="${erro}" class="alert-error" th:text="${erro}"></div>

        <form method="post" action="/login">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" class="form-control"
                       placeholder="Digite seu usuário" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <div class="password-container">
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           placeholder="Digite sua senha"
                           required>
                    <button type="button" class="toggle-password" tabindex="-1">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn-primary">Entrar no Sistema</button>
        </form>

        <div class="links">
            <a href="/cadastro">📝 Criar nova conta</a>
        </div>
    </div>
</div>
<script th:src="@{/js/senha.js}"></script>
</body>
</html>
