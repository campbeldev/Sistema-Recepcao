<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campbel - Usuários</title>
  <link rel="stylesheet" th:href="@{/css/usuarios.css}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="header">
  <div class="container">
    <div class="header-content">
      <h1>Gerenciar Usuários</h1>
      <a th:href="@{/}" class="back-link">← Voltar</a>
    </div>
  </div>
</header>

<main class="container">
  <div class="lista-header">
    <h2>Lista de Usuários do Sistema</h2>
    <a th:href="@{/cadastro}" class="btn-novo">
      <span>➕</span> Novo Usuário
    </a>
  </div>

  <div th:if="${param.sucesso != null}" class="alert-success">
    ✅ Usuário cadastrado com sucesso!
  </div>

  <table class="tabela-usuarios">
    <thead>
    <tr>
      <th>ID</th>
      <th>Nome</th>
      <th>Usuário</th>
      <th>Email</th>
      <th>Tipo</th>
      <th>Status</th>
      <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${usuarios}">
      <td th:text="${u.id}">1</td>
      <td th:text="${u.nome}">João Silva</td>
      <td th:text="${u.username}">joao</td>
      <td th:text="${u.email}">joao@email.com</td>
      <td>
        <span th:if="${u.role == 'ADMIN'}" class="badge-admin">👑 Admin</span>
        <span th:unless="${u.role == 'ADMIN'}" class="badge-recepcionista">👩‍💼 Recepcionista</span>
      </td>
      <td>
                        <span th:if="${u.ativo}" class="status-ativo">
                            <span>✅</span> Ativo
                        </span>
        <span th:unless="${u.ativo}" class="status-inativo">
                            <span>❌</span> Inativo
                        </span>
      </td>
      <td>
        <div class="acoes">
          <!-- BOTÃO EDITAR (NOVO) -->
          <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn-acao btn-editar" title="Editar">
            ✏️ Editar
          </a>
          <!-- Botão Desativar/Ativar -->
          <form th:if="${u.ativo}" method="post" th:action="@{/usuarios/desativar/{id}(id=${u.id})}">
            <button type="submit" class="btn-acao btn-desativar" title="Desativar">
              🔴 Desativar
            </button>
          </form>
          <form th:unless="${u.ativo}" method="post" th:action="@{/usuarios/ativar/{id}(id=${u.id})}">
            <button type="submit" class="btn-acao btn-ativar" title="Ativar">
              🟢 Ativar
            </button>
          </form>

          <!-- Botão Apagar (só para testes) -->
          <form method="post" th:action="@{/usuarios/apagar/{id}(id=${u.id})}"
                onsubmit="return confirm('⚠️ TEM CERTEZA?\n\nIsso apagará permanentemente este usuário!')">
            <button type="submit" class="btn-acao btn-apagar" title="Apagar">
              🗑️ Apagar
            </button>
          </form>
        </div>
      </td>
    </tr>

    <tr th:if="${usuarios.isEmpty()}">
      <td colspan="7" class="empty-message">
        Nenhum usuário cadastrado
      </td>
    </tr>
    </tbody>
  </table>
</main>
</body>
</html>
