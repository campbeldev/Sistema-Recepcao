<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campbel - Cadastro de Contato</title>
    <link rel="stylesheet" th:href="@{/css/contatc.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="header">
    <div class="header-content">
        <img th:src="@{/images/logo-campbel.png}" alt="Campbel" class="logo-small">
        <h1>Cadastro de Contato</h1>
        <a th:href="@{/}" class="back-link">← Voltar</a>
    </div>
</header>

<main class="container">
    <div class="card">
        <h2>Novo Contato</h2>
        <form id="formContato">
            <div class="form-row">
                <div class="form-group">
                    <label for="nomeParticipante">Nome do Participante *</label>
                    <input type="text"
                           id="nomeParticipante"
                           name="nomeParticipante"
                           class="form-control"
                           placeholder="Digite o nome"
                           required>
                </div>

                <div class="form-group">
                    <label for="nomeEmpresa">Nome da Empresa</label>
                    <input type="text"
                           id="nomeEmpresa"
                           name="nomeEmpresa"
                           class="form-control"
                           placeholder="Digite o nome da empresa">
                </div>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>  <!-- ← Removeu o * -->
                <input type="email"
                       id="email"
                       name="email"
                       class="form-control"
                       placeholder="Digite o e-mail (opcional)">
                <small class="field-hint">Opcional. Se não informado, não receberá e-mails</small>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="telefone">Telefone Pessoal</label>
                    <input type="text"
                           id="telefone"
                           name="telefone"
                           class="form-control"
                           placeholder="(11) 91234-5678"
                           maxlength="15">
                    <small class="field-hint">Digite apenas números</small>
                </div>

                <div class="form-group">
                    <label for="whatsapp">📱 WhatsApp</label>
                    <input type="text" id="whatsapp" class="form-control" placeholder="(11) 91234-5678" maxlength="15">
                    <small class="field-hint">Digite apenas números</small>
                </div>
            </div>

                <div class="form-group">
                    <label for="telefoneEmpresarial">Telefone Empresarial</label>
                    <input type="text"
                           id="telefoneEmpresarial"
                           name="telefoneEmpresarial"
                           class="form-control"
                           placeholder="(11) 91234-5678"
                           maxlength="15">
                    <small class="field-hint">Digite apenas números</small>
                </div>
            </div>

            <button type="submit" class="btn-primary">SALVAR CONTATO</button>
        </form>
    </div>

</main>

<script th:src="@{/js/contato.js}"></script>
</body>
</html>
