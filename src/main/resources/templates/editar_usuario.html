<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campbel - Editar Usuário</title>
    <link rel="stylesheet" th:href="@{/css/editar_usuario.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="card">
        <div class="logo-wrapper">
            <img th:src="@{/images/logo-campbel.png}" alt="Campbel" class="logo">
        </div>

        <h2>Editar Usuário</h2>

        <div th:if="${erro}" class="alert-error" th:text="${erro}"></div>

        <form method="post" th:action="@{/usuarios/editar/{id}(id=${usuario.id})}">
            <input type="hidden" name="id" th:value="${usuario.id}">

            <div class="form-group">
                <label for="nome">👤 Nome Completo</label>
                <input type="text" id="nome" name="nome" class="form-control"
                       th:value="${usuario.nome}" placeholder="Digite o nome completo" required>
            </div>

            <div class="form-group">
                <label for="email">📧 E-mail</label>
                <input type="email" id="email" name="email" class="form-control"
                       th:value="${usuario.email}" placeholder="Digite o e-mail" required>
            </div>

            <div class="form-group">
                <label for="username">🔑 Usuário (login)</label>
                <input type="text" id="username" name="username" class="form-control username-field"
                       th:value="${usuario.username}" readonly>
                <span class="username-hint">O nome de usuário não pode ser alterado</span>
            </div>

            <!-- 🔐 NOVO CAMPO: SENHA OPCIONAL -->
            <div class="form-group">
                <label for="password">🔐 Nova Senha</label>
                <div class="password-container">
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           placeholder="Deixe em branco para manter a atual">
                    <button type="button" class="toggle-password" tabindex="0">👁️</button>
                </div>
                <small class="field-hint" style="color: #f1592a;">
                    ⚠️ Preencha apenas se quiser alterar a senha
                </small>
            </div>
            <div class="form-group">
                <label for="role">👥 Tipo de Usuário</label>
                <select id="role" name="role" class="form-control" required>
                    <option value="RECEPCIONISTA" th:selected="${usuario.role == 'RECEPCIONISTA'}">👩‍💼 Recepcionista</option>
                    <option value="ADMIN" th:selected="${usuario.role == 'ADMIN'}">👑 Administrador</option>
                </select>
            </div>

            <div class="form-group">
                <label for="ativo">⚡ Status</label>
                <select id="ativo" name="ativo" class="form-control">
                    <option value="true" th:selected="${usuario.ativo}">✅ Ativo</option>
                    <option value="false" th:selected="${!usuario.ativo}">❌ Inativo</option>
                </select>
            </div>

            <div class="acoes">
                <a th:href="@{/usuarios}" class="btn-cancelar">Cancelar</a>
                <button type="submit" class="btn-salvar">
                    <span>💾</span> Salvar Alterações
                </button>
            </div>
        </form>
    </div>
</div>
<script th:src="@{/js/editar_usuario.js}"></script>
<script th:src="@{/js/senha.js}"></script>
</body>
</html>
