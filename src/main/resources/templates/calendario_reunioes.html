<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${titulo}">Campbel - Calendário</title>
  <link rel="stylesheet" th:href="@{/css/calendario.css}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="header">
  <div class="header-content">
    <img th:src="@{/images/logo-campbel.png}" alt="Campbel" class="logo-small">
    <h1 th:text="${titulo}">Calendário</h1>
    <a th:href="@{/}" class="back-link">← Voltar</a>
  </div>
</header>

<main class="container">
  <div class="calendario-container" id="calendarioContainer">
    <div class="loading">Carregando...</div>
  </div>
</main>

<input type="hidden" id="tipoCalendario" th:value="${tipo}">
<script th:src="@{/js/calendario.js}"></script>
</body>
</html>
