<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Relatório</title>
    <link rel="stylesheet" th:href="@{/css/modal.css}">
</head>
<body>
<!-- MODAL DE RELATÓRIO -->
<div id="modalRelatorio" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📊 Gerar Relatório Mensal</h3>
            <span class="modal-close" onclick="fecharModalRelatorio()">&times;</span>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="mesRelatorio">Mês:</label>
                <select id="mesRelatorio" class="form-control">
                    <option value="1">Janeiro</option>
                    <option value="2">Fevereiro</option>
                    <option value="3">Março</option>
                    <option value="4">Abril</option>
                    <option value="5">Maio</option>
                    <option value="6">Junho</option>
                    <option value="7">Julho</option>
                    <option value="8">Agosto</option>
                    <option value="9">Setembro</option>
                    <option value="10">Outubro</option>
                    <option value="11">Novembro</option>
                    <option value="12">Dezembro</option>
                </select>
            </div>
            <div class="form-group">
                <label for="anoRelatorio">Ano:</label>
                <select id="anoRelatorio" class="form-control">
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026" selected>2026</option>
                    <option value="2027">2027</option>
                </select>
            </div>
            <div class="form-group">
                <label>Tipo de arquivo:</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="tipoRelatorio" value="csv" checked> CSV (Excel)
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="tipoRelatorio" value="txt"> TXT
                    </label>
                </div>
            </div>
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="incluirCanceladas" checked>
                    Incluir reuniões canceladas
                </label>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="fecharModalRelatorio()">Cancelar</button>
            <button class="btn-primary" onclick="gerarRelatorio()">📥 Baixar Relatório</button>
        </div>
    </div>
</div>

</body>
</html>
