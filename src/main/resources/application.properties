spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recepcao_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
server.address=0.0.0.0
server.port=8080
spring.mail.host=email-ssl.com.br
spring.mail.port=465
spring.mail.username=recepcao@campbel.com.br
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
server.forward-headers-strategy=framework
# Endereço que entra nos links dos e-mails (o que as pessoas abrem no navegador)
app.url-publica=${APP_URL:http://localhost:8080}

# Carrega anfitriões e participantes em lote, em vez de uma consulta por reunião
spring.jpa.properties.hibernate.default_batch_fetch_size=50
